<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D08A5C"/>
      <stop offset="0.6" stop-color="#C47B4E"/>
      <stop offset="1" stop-color="#A9623A"/>
    </linearGradient>
    <linearGradient id="skinSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B56C42"/>
      <stop offset="1" stop-color="#C98352"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C98352"/>
      <stop offset="1" stop-color="#B0683E"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2E"/>
      <stop offset="1" stop-color="#17171A"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="800"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="800" height="800" fill="#FDE8E8"/>

  <!-- shirt / torso -->
  <path d="M90 800 C 100 640, 170 560, 300 535 L 520 535 C 650 560, 720 640, 730 800 Z" fill="url(#shirt)"/>
  <!-- neck -->
  <path d="M330 470 L 330 548 Q 410 590 490 548 L 490 470 Z" fill="#A9623A"/>
  <!-- collar -->
  <path d="M318 540 Q 410 600 502 540" fill="none" stroke="#0E0E10" stroke-width="10" stroke-linecap="round"/>

  <!-- ears -->
  <ellipse cx="225" cy="330" rx="36" ry="52" fill="url(#skinSide)"/>
  <path d="M215 305 Q 235 320 222 350" fill="none" stroke="#8E4F2C" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="595" cy="330" rx="36" ry="52" fill="#B56C42"/>
  <path d="M605 305 Q 585 320 598 350" fill="none" stroke="#8E4F2C" stroke-width="4" stroke-linecap="round"/>

  <!-- head -->
  <path d="M410 120 C 530 120, 600 200, 600 320 C 600 440, 520 505, 410 505 C 300 505, 220 440, 220 320 C 220 200, 290 120, 410 120 Z" fill="url(#skin)"/>
  <!-- cheek shading -->
  <ellipse cx="300" cy="395" rx="40" ry="22" fill="#B86E44" opacity="0.45"/>
  <ellipse cx="522" cy="395" rx="40" ry="22" fill="#B86E44" opacity="0.45"/>

  <!-- hair: short, dark, swept with volume on top -->
  <path d="M222 300 C 205 190, 280 95, 410 92 C 535 90, 615 175, 600 300
           C 590 255, 575 225, 548 210
           C 520 200, 470 205, 430 200
           C 380 195, 330 200, 300 215
           C 265 230, 240 260, 222 300 Z" fill="#141416"/>
  <path d="M300 205 C 330 170, 380 160, 430 172 C 470 150, 530 160, 560 200 C 520 185, 480 190, 455 205 C 420 190, 360 188, 300 205 Z" fill="#141416"/>
  <path d="M280 165 C 340 120, 450 112, 545 158" fill="none" stroke="#2C2C30" stroke-width="9" stroke-linecap="round"/>
  <path d="M330 140 C 380 128, 430 128, 470 138" fill="none" stroke="#2C2C30" stroke-width="6" stroke-linecap="round"/>

  <!-- eyebrows: thick and straight -->
  <path d="M285 262 Q 330 246 378 256" fill="none" stroke="#141416" stroke-width="16" stroke-linecap="round"/>
  <path d="M442 256 Q 490 246 535 262" fill="none" stroke="#141416" stroke-width="16" stroke-linecap="round"/>

  <!-- eyes (calm, slightly heavy-lidded) -->
  <path d="M290 300 Q 333 275 376 300 Q 333 322 290 300 Z" fill="#FFFFFF"/>
  <circle cx="336" cy="300" r="17" fill="#1A1210"/>
  <circle cx="342" cy="294" r="5" fill="#FFFFFF"/>
  <path d="M286 298 Q 333 270 380 298" fill="none" stroke="#141416" stroke-width="6" stroke-linecap="round"/>

  <path d="M444 300 Q 487 275 530 300 Q 487 322 444 300 Z" fill="#FFFFFF"/>
  <circle cx="484" cy="300" r="17" fill="#1A1210"/>
  <circle cx="490" cy="294" r="5" fill="#FFFFFF"/>
  <path d="M440 298 Q 487 270 534 298" fill="none" stroke="#141416" stroke-width="6" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M410 300 Q 404 345 392 362 Q 410 376 428 362" fill="none" stroke="#8E4F2C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="410" cy="360" rx="26" ry="16" fill="#B5683D" opacity="0.6"/>

  <!-- thin mustache -->
  <path d="M352 398 Q 380 382 410 390 Q 440 382 468 398" fill="none" stroke="#141416" stroke-width="7" stroke-linecap="round"/>
  <!-- lips, slightly pursed -->
  <path d="M378 410 Q 410 400 442 410 Q 436 432 410 434 Q 384 432 378 410 Z" fill="#C5786A"/>
  <path d="M384 412 Q 410 418 436 412" fill="none" stroke="#8E4A3E" stroke-width="3" stroke-linecap="round"/>
  <!-- chin strip / goatee -->
  <path d="M410 446 L 410 478" stroke="#141416" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 474 Q 410 496 420 474 Z" fill="#141416"/>

  <!-- raised hand near chin, watch on wrist -->
  <path d="M120 800 C 140 700, 190 640, 250 600 L 300 640 C 260 690, 230 740, 225 800 Z" fill="url(#hand)"/>
  <!-- watch -->
  <rect x="215" y="585" width="80" height="44" rx="10" transform="rotate(38 255 607)" fill="#9AA0A6"/>
  <rect x="226" y="590" width="58" height="34" rx="8" transform="rotate(38 255 607)" fill="#C9CED3"/>
  <circle cx="255" cy="607" r="14" fill="#3B4046"/>
  <path d="M255 607 L 262 600" stroke="#C9CED3" stroke-width="3" stroke-linecap="round"/>
  <!-- palm / fingers -->
  <path d="M270 560 C 290 520, 350 505, 410 505 C 455 505, 470 520, 470 535
           C 470 548, 455 555, 440 555 C 460 560, 465 578, 450 590
           C 470 598, 465 622, 445 628 C 455 645, 440 662, 418 660
           L 320 660 C 285 650, 260 610, 270 560 Z" fill="url(#hand)"/>
  <path d="M395 555 L 440 555" stroke="#7E4426" stroke-width="4" stroke-linecap="round"/>
  <path d="M395 590 L 450 590" stroke="#7E4426" stroke-width="4" stroke-linecap="round"/>
  <path d="M395 628 L 445 628" stroke="#7E4426" stroke-width="4" stroke-linecap="round"/>
  <!-- nails -->
  <ellipse cx="455" cy="528" rx="10" ry="8" fill="#E2B39A"/>
  <ellipse cx="452" cy="572" rx="9" ry="7" fill="#E2B39A"/>
  </g>
</svg>
