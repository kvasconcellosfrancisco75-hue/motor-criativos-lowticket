# App do Radar (Cloudflare Workers). Publicar: cd app && npm run publicar (embute public/ e publica)
# Segredos (npx wrangler secret put <NOME>): APP_SENHA, RADAR_TOKEN, VAPID_PUBLICA, VAPID_PRIVADA. Veja docs/app.md.
name = "radar-ofertas"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "DADOS"
id = "3c83ab45b3e14e0ab97bdd4565d00d7f"

[vars]
VAPID_SUB = "https://radar-ofertas.virallab.workers.dev"
